name: Azure Static Web Apps CI/CD

trigger:
  branches:
    include:
      - develop

pr:
  branches:
    include:
      - develop

jobs:
- job: build_and_deploy
  displayName: Build Angular & Deploy to Azure SWA
  pool:
    vmImage: ubuntu-latest

  variables:
  - group: Azure-Static-Web-Apps-calm-pond-02d52290f-variable-group

  steps:
  - checkout: self
    submodules: true

  # 1. Build Angular manually (NO Oryx)
  - task: NodeTool@0
    inputs:
      versionSpec: '20.x'
    displayName: 'Install Node 20'

  - script: |
      npm ci
      npm run build
    displayName: "Build Angular App"

  # 2. Deploy using your DIST folder directly
  - task: AzureStaticWebApp@0
    displayName: "Deploy to SWA (dist-only mode)"
    inputs:
      azure_static_web_apps_api_token: $(AZURE_STATIC_WEB_APPS_API_TOKEN_CALM_POND_02D52290F)
      app_location: "dist/cuba-angular"    # <--- ESTA es la clave
      api_location: ""
      output_location: ""                  # <--- importa que esté vacío
