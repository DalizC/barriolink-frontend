<div class="container-fluid">
  <div class="row">
    <div class="col-sm-12">
      <div class="card">
        <div class="card-header pb-0">
          <h5>Noticias del Barrio</h5>
          <p>Gestiona las noticias y comunicados de la comunidad</p>
        </div>
        <div class="card-body">
          <div class="row mb-3">
            <div class="col-md-6">
              <button class="btn btn-primary me-2">
                <i class="fa fa-plus me-2"></i>Nueva Noticia
              </button>
              <button class="btn btn-outline-secondary">
                <i class="fa fa-filter me-2"></i>Filtros
              </button>
            </div>
            <div class="col-md-6 text-end">
              <select class="form-select" style="width: 200px; display: inline-block; margin-right: 10px;">
                <option>Todas las categorías</option>
                <option>Seguridad</option>
                <option>Infraestructura</option>
                <option>Servicios</option>
              </select>
            </div>
          </div>
          
          <div class="row">
            <div class="col-lg-12" *ngFor="let article of news">
              <div class="card news-card mb-3">
                <div class="card-body">
                  <div class="row">
                    <div class="col-md-8">
                      <div class="d-flex justify-content-between align-items-start mb-2">
                        <h5 class="card-title mb-0">{{ article.title }}</h5>
                        <span class="badge" 
                              [ngClass]="{
                                'bg-success': article.status === 'Publicado',
                                'bg-warning': article.status === 'Borrador'
                              }">
                          {{ article.status }}
                        </span>
                      </div>
                      <p class="card-text text-muted">{{ article.summary }}</p>
                      <div class="d-flex align-items-center text-muted small">
                        <i class="fa fa-user me-1"></i>{{ article.author }}
                        <span class="mx-2">•</span>
                        <i class="fa fa-calendar me-1"></i>{{ article.date }}
                        <span class="mx-2">•</span>
                        <span class="badge bg-light text-dark">{{ article.category }}</span>
                      </div>
                    </div>
                    <div class="col-md-4 text-end">
                      <div class="btn-group-vertical">
                        <button class="btn btn-sm btn-outline-info mb-1">Ver</button>
                        <button class="btn btn-sm btn-outline-warning mb-1">Editar</button>
                        <button class="btn btn-sm btn-outline-success mb-1">Publicar</button>
                        <button class="btn btn-sm btn-outline-danger">Eliminar</button>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
