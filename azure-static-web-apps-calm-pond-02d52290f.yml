name: Azure Static Web Apps CI/CD

pr:
  branches:
    include:
      - develop

trigger:
  branches:
    include:
      - develop

jobs:
- job: build_and_deploy
  displayName: Build and Deploy Angular to SWA
  pool:
    vmImage: ubuntu-latest

  variables:
  - group: Azure-Static-Web-Apps-calm-pond-02d52290f-variable-group

  steps:
  - checkout: self
    submodules: true

  # --------------------------
  # 1) Instalar Node 20 (Angular 20 lo requiere)
  # --------------------------
  - task: NodeTool@0
    inputs:
      versionSpec: '20.x'
    displayName: "Use Node 20"

  # --------------------------
  # 2) Instalar dependencias
  # --------------------------
  - script: |
      npm ci
    displayName: "Install dependencies"

  # --------------------------
  # 3) Build Angular
  # --------------------------
  - script: |
      npm run build
    displayName: "Build Angular"

  # --------------------------
  # 4) Copiar salida real
  #    (descubrimos que se genera en dist/cuba-angular)
  # --------------------------
  - script: |
      echo "Copiando dist/cuba-angular a $(Build.ArtifactStagingDirectory)/app"
      mkdir -p "$(Build.ArtifactStagingDirectory)/app"
      cp -R dist/cuba-angular/* "$(Build.ArtifactStagingDirectory)/app"
    displayName: "Prepare SWA artifact"

  # --------------------------
  # 5) Deploy Static Web App
  # --------------------------
  - task: AzureStaticWebApp@0
    displayName: "Deploy SWA"
    inputs:
      azure_static_web_apps_api_token: $(AZURE_STATIC_WEB_APPS_API_TOKEN_CALM_POND_02D52290F)
      app_location: "$(Build.ArtifactStagingDirectory)/app"
      api_location: ""
      output_location: ""
