<div class="container-fluid">
  <div class="row">
    <div class="col-sm-12">
      <div class="card">
        <div class="card-header pb-0">
          <h5>Proyectos Comunitarios</h5>
          <p>Gestión de proyectos de mejoramiento barrial</p>
        </div>
        <div class="card-body">
          <div class="row mb-3">
            <div class="col-md-6">
              <button class="btn btn-primary">
                <i class="fa fa-plus me-2"></i>Nuevo Proyecto
              </button>
            </div>
          </div>
          
          <div class="row">
            <div class="col-lg-4 col-md-6 col-sm-12 mb-3" *ngFor="let project of projects">
              <div class="card project-manage-card h-100">
                <div class="card-body">
                  <h6 class="card-title">{{ project.name }}</h6>
                  <p class="card-text text-muted mb-2">
                    <i class="fa fa-user me-2"></i><strong>Manager:</strong> {{ project.manager }}
                  </p>
                  <p class="card-text text-success mb-2">
                    <i class="fa fa-dollar-sign me-2"></i><strong>Presupuesto:</strong> ${{ project.budget | number }}
                  </p>
                  <div class="mb-3">
                    <div class="d-flex justify-content-between mb-1">
                      <small>Progreso</small>
                      <small>{{ project.progress }}%</small>
                    </div>
                    <div class="progress" style="height: 8px;">
                      <div class="progress-bar" 
                           [style.width.%]="project.progress"
                           [ngClass]="{
                             'bg-success': project.progress >= 80,
                             'bg-warning': project.progress >= 50 && project.progress < 80,
                             'bg-info': project.progress < 50
                           }">
                      </div>
                    </div>
                  </div>
                  <span class="badge mb-3" 
                        [ngClass]="{
                          'bg-success': project.status === 'Casi Terminado',
                          'bg-primary': project.status === 'En Progreso',
                          'bg-info': project.status === 'Iniciado'
                        }">
                    {{ project.status }}
                  </span>
                  <div class="d-flex gap-1">
                    <button class="btn btn-sm btn-outline-info flex-fill">Ver</button>
                    <button class="btn btn-sm btn-outline-warning flex-fill">Editar</button>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
