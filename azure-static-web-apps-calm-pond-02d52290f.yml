name: Azure Static Web Apps CI/CD

trigger:
  branches:
    include:
      - develop

pr:
  branches:
    include:
      - develop

jobs:
- job: build_and_deploy
  displayName: Build Angular & Deploy to Azure SWA
  pool:
    vmImage: ubuntu-latest

  variables:
  - group: Azure-Static-Web-Apps-calm-pond-02d52290f-variable-group

  steps:
  - checkout: self
    submodules: true

  # 1. Build Angular manually (NO Oryx)
  - task: NodeTool@0
    inputs:
      versionSpec: '18.x'
    displayName: 'Install Node'

  - script: |
      npm install
      npm run build --if-present
    displayName: "Build Angular App"

  # 2. Deploy using YOUR dist folder
  - task: AzureStaticWebApp@0
    inputs:
      azure_static_web_apps_api_token: $(AZURE_STATIC_WEB_APPS_API_TOKEN_CALM_POND_02D52290F)
      app_location: "/"
      api_location: ""
      output_location: "dist/cuba-angular"
    displayName: "Deploy to SWA (using dist/cuba-angular ONLY)"
