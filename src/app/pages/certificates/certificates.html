<div class="container-fluid">
  <div class="row">
    <div class="col-sm-12">
      <div class="card">
        <div class="card-header pb-0">
          <h5>Certificaciones Profesionales</h5>
          <p>Gestiona las certificaciones y licencias de los proveedores</p>
        </div>
        <div class="card-body">
          <div class="row mb-3">
            <div class="col-md-6">
              <button class="btn btn-primary">
                <i class="fa fa-certificate me-2"></i>Nuevo Certificado
              </button>
            </div>
            <div class="col-md-6 text-end">
              <select class="form-select" style="width: 200px; display: inline-block; margin-right: 10px;">
                <option>Todos los estados</option>
                <option>Vigente</option>
                <option>Vencido</option>
              </select>
            </div>
          </div>
          
          <div class="row">
            <div class="col-lg-6 col-md-12 mb-3" *ngFor="let cert of certificates">
              <div class="card certificate-card h-100">
                <div class="card-body">
                  <div class="d-flex justify-content-between align-items-start mb-2">
                    <h6 class="card-title">{{ cert.name }}</h6>
                    <span class="badge" 
                          [ngClass]="{
                            'bg-success': cert.status === 'Vigente',
                            'bg-danger': cert.status === 'Vencido'
                          }">
                      {{ cert.status }}
                    </span>
                  </div>
                  <p class="card-text text-muted mb-1">
                    <i class="fa fa-university me-2"></i><strong>Emisor:</strong> {{ cert.issuer }}
                  </p>
                  <p class="card-text text-muted mb-3">
                    <i class="fa fa-calendar me-2"></i><strong>Fecha:</strong> {{ cert.date }}
                  </p>
                  <div class="d-flex gap-1">
                    <button class="btn btn-sm btn-outline-info flex-fill">Ver</button>
                    <button class="btn btn-sm btn-outline-primary flex-fill">Descargar</button>
                    <button class="btn btn-sm btn-outline-warning">
                      <i class="fa fa-edit"></i>
                    </button>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
