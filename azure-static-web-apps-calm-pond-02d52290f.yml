name: Azure Static Web Apps CI/CD

trigger:
  branches:
    include:
      - develop

pr:
  branches:
    include:
      - develop

jobs:
- job: build_and_deploy
  displayName: Build Angular & Deploy to Azure SWA
  pool:
    vmImage: ubuntu-latest

  variables:
  - group: Azure-Static-Web-Apps-calm-pond-02d52290f-variable-group

  steps:
  - checkout: self
    submodules: true

  # 1. Install proper Node version for Angular 20
  - task: NodeTool@0
    inputs:
      versionSpec: '20.x'
    displayName: 'Install Node 20'

  # 2. Build Angular manually
  - script: |
      npm ci
      npm run build
    displayName: "Build Angular"

  # 3. Deploy dist directly (this time **forcing** the artifact folder)
  - task: AzureStaticWebApp@0
    displayName: "Deploy to SWA (forced dist mode)"
    inputs:
      azure_static_web_apps_api_token: $(AZURE_STATIC_WEB_APPS_API_TOKEN_CALM_POND_02D52290F)
      app_location: "/"                           # ignorable
      output_location: ""                         # ignorable
      app_artifact_location: "dist/cuba-angular"  # ⬅️ LA CLAVE
      api_location: ""
      skip_app_build: true                        # ⬅️ LA OTRA CLAVE