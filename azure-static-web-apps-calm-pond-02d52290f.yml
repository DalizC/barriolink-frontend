name: Azure Static Web Apps CI/CD

trigger:
  branches:
    include:
      - develop

pr:
  branches:
    include:
      - develop

jobs:
- job: build_and_deploy
  displayName: Build Angular & Deploy to Azure SWA
  pool:
    vmImage: ubuntu-latest

  variables:
  - group: Azure-Static-Web-Apps-calm-pond-02d52290f-variable-group

  steps:
  - checkout: self
    submodules: true

  # 1. Install proper Node version for Angular 20
  - task: NodeTool@0
    inputs:
      versionSpec: '20.x'
    displayName: 'Install Node 20'

  # 2. Build Angular
  - script: |
      npm ci
      npm run build
    displayName: "Build Angular"

  # 3. Verificar la estructura del build
  - script: |
      echo "====== Build Output Structure ======"
      ls -la dist/
      echo ""
      echo "Contents of dist/cuba-angular:"
      ls -la dist/cuba-angular/
      echo ""
      echo "Contents of dist/cuba-angular/browser (if exists):"
      ls -la dist/cuba-angular/browser/ 2>/dev/null || echo "browser/ does not exist"
      echo ""
      echo "Checking for index.html:"
      if [ -f "dist/cuba-angular/index.html" ]; then
        echo "✓ index.html found in dist/cuba-angular"
      elif [ -f "dist/cuba-angular/browser/index.html" ]; then
        echo "✓ index.html found in dist/cuba-angular/browser"
      else
        echo "✗ index.html NOT found in expected locations"
        echo "Searching for index.html recursively:"
        find dist/ -name "index.html" -type f
      fi
    displayName: "Verify build structure"
    continueOnError: true

  # 4. Deploy to SWA con la configuración correcta
  - task: AzureStaticWebApp@0
    displayName: "Deploy to Azure Static Web Apps"
    inputs:
      azure_static_web_apps_api_token: $(AZURE_STATIC_WEB_APPS_API_TOKEN_CALM_POND_02D52290F)
      workingDirectory: $(Build.SourcesDirectory)
      app_location: "dist/cuba-angular/browser"  # Apunta directamente al build final con index.html
      api_location: ""
      output_location: ""                # Vacío cuando skip_app_build: true
      skip_app_build: true